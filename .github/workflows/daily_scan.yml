name: NIFTY 500 Pre-Market Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nifty500-bot-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NIFTY 500 scan
        run: python run_scan.py

      - name: Validate generated scan state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("scan_state.json").read_text(encoding="utf-8"))
          required = {"Nifty 50", "Nifty Next 50", "Nifty Midcap 150", "Nifty Smallcap 250", "Nifty 500"}
          market = state.get("market") or {}
          index_basis = market.get("index_basis") or {}
          health = state.get("health") or {}
          breadth = state.get("breadth_universe") or []
          strategy_coverage = int(health.get("strategy_coverage", len(state.get("classified") or [])) or 0)

          if len(breadth) != 500:
              raise SystemExit(f"Invalid breadth universe: expected 500, got {len(breadth)}")
          if set(index_basis) != required:
              missing = sorted(required - set(index_basis))
              extra = sorted(set(index_basis) - required)
              raise SystemExit(f"Invalid market basis; missing={missing}, extra={extra}")
          if health.get("status") == "LOW_COVERAGE" or strategy_coverage < 480:
              raise SystemExit(f"Refusing to publish low-coverage scan: strategy_coverage={strategy_coverage}")
          PY

      - name: Publish scan state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f scan_state.json
          cp scan_state.json "$RUNNER_TEMP/scan_state.json"
          # The generated state is untracked on main. Remove it from the
          # working tree before switching branches; git clean is deliberate here
          # because the generated copy is already safely stored in RUNNER_TEMP.
          rm -rf scan_state.json
          git clean -fd -- scan_state.json
          test ! -e scan_state.json

          git fetch origin bot-state || true
          if git show-ref --verify --quiet refs/remotes/origin/bot-state; then
            git checkout -B bot-state origin/bot-state
          else
            git checkout --orphan bot-state
            git rm -rf . || true
          fi

          cp "$RUNNER_TEMP/scan_state.json" scan_state.json
          git add scan_state.json
          git commit -m "Update NIFTY 500 scan state" || exit 0
          git push origin bot-state
