name: NIFTY 500 Pre-Market Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nifty500-premarket-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build NIFTY 500 state
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python run_scan.py

      - name: Publish state to bot-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state
            git switch -C bot-state --track origin/bot-state
          else
            git switch --orphan bot-state
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp ../scan_state.json scan_state.json
          cp ../monthly_stock_ranking.csv monthly_stock_ranking.csv
          git add scan_state.json monthly_stock_ranking.csv

          if git diff --cached --quiet; then
            echo "No state changes to publish."
          else
            git commit -m "Update NIFTY 500 scan state"
            git push --set-upstream origin bot-state
          fi
