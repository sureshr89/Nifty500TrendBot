name: NIFTY 500 Trend Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore latest state
        run: |
          git fetch origin bot-state || true
          git show origin/bot-state:scan_state.json > scan_state.json 2>/dev/null || true
          git show origin/bot-state:monthly_stock_ranking.csv > monthly_stock_ranking.csv 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Dhan worker
        run: python run_scan.py

      - name: Validate new state schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("scan_state.json").read_text(encoding="utf-8"))
          required = {"health", "market", "classified", "breadth_universe", "buy_set", "sell_set", "state_schema_version"}
          missing = required - set(state)
          if missing:
              raise SystemExit(f"State validation failed. Missing keys: {sorted(missing)}")
          breadth = state.get("breadth_universe") or []
          if len(breadth) < 480:
              raise SystemExit(f"State validation failed. breadth_universe has {len(breadth)} stocks; need at least 480")
          print(f"STATE OK schema={state['state_schema_version']} classified={len(state['classified'])} breadth={len(breadth)}")
          PY

      - name: Publish latest state
        run: |
          mkdir -p /tmp/nifty500trend-state
          cp scan_state.json /tmp/nifty500trend-state/scan_state.json
          if [ -f monthly_stock_ranking.csv ]; then
            cp monthly_stock_ranking.csv /tmp/nifty500trend-state/monthly_stock_ranking.csv
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan bot-state-new
          git rm -rf . || true

          cp /tmp/nifty500trend-state/scan_state.json scan_state.json
          if [ -f /tmp/nifty500trend-state/monthly_stock_ranking.csv ]; then
            cp /tmp/nifty500trend-state/monthly_stock_ranking.csv monthly_stock_ranking.csv
          fi

          git add scan_state.json monthly_stock_ranking.csv
          git commit -m "Update trend worker state"
          git branch -M bot-state
          git push origin bot-state --force
